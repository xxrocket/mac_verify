<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mac Verify · Tauri</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        padding-top: 15vh;
        background: #f6f8fa;
        color: #1f2328;
      }
      main {
        width: 320px;
      }
      input,
      button {
        font-size: 1rem;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        border: 1px solid #d0d7de;
      }
      button {
        background: #1f6feb;
        color: #fff;
        border-color: #1f6feb;
        cursor: pointer;
      }
      #greet-result {
        min-height: 1.5em;
        font-weight: 600;
      }
      #host-info {
        color: #656d76;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tauri on macOS ✅</h1>
      <p>Host (from Rust): <span id="host-info">…</span></p>
      <input id="name-input" placeholder="your name" />
      <button id="greet-btn">Greet</button>
      <p id="greet-result"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
