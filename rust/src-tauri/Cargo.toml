[package]
name = "mac-verify-tauri"
version = "0.1.0"
description = "Minimal Tauri v2 app to verify the macOS build toolchain"
edition = "2021"
rust-version = "1.89"

[lib]
name = "mac_verify_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
